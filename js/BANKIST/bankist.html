<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bankist - Vivek Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="logo.png">
</head>
<body>
    <nav>
        <p class="welcomemsg">Login in to get started</p>
        <img src="logo.png" alt=""  class="logo">
        <form action="">
            
           <input type="text" name="" id="" placeholder="USER" class="userinput userlogin" maxlength="6">
            <input type="text" name="" id="" placeholder="PIN" maxlength="4" class="userinput userpin">
               
          <button class="loginbtn">Login</button>
            
        </form>
    </nav>
    <main class="dashboard"  >
        <!-- BALANCE  -->
        <div class="balance">
            <div>
                <p class="balancelabel">Current balance</p>
                <p class="asof">As of : <span class="date">05/05/24</span></p>
            </div>
            <div class="totalbalance">$12132120000</div>

        </div>

        <div class="summary-block">
            <div class="summary">
               
                    <p class="summarylabel">In</p>
                    <p class="summaryvalue summaryvaluein">$2700</p>
               
                    <p class="summarylabel">Out</p>
                    <p class="summaryvalue summaryvalueout">$9290</p>
                
                    <p class="summarylabel">Interest</p>
                    <p class="summaryvalue summaryinterest">$329</p>
               
                
               
               
                <button class="btnsort">Sort</button>
                
                
            </div>
            <div class="logouttime mTop30"> You will be logged out in <span class="timer">05:00</span> </div>

        </div>
        
       
            
       
        <!-- MOVEMENTS -->
        <div class="movements">
            <div class="movementsrow">
                <div class="movementtype movementtypedeposit">1 deposit</div>
                <div>
                    <span class="movementdate">12/03/2024</span>
                    
                </div>
                <div>
                    <span class="movementvalue">$1890</span>
                </div>
            </div>
            <div class="movementsrow">
                <div class="movementtype movementtypewithdrawl">1 WITHDRAWAL</div>
                <div>
                    <span class="movementdate">&nbsp;&nbsp;&nbsp;&nbsp;12/03/2024</span>
                    
                </div>
                <div>
                    <span class="movementvalue">$1890</span>
                </div>
            </div>
           
        </div>
       

        <!-- OPERATION :  TRANSFR-->

        <div class="operation operationtransfer">
            <p class="operationlabel">Transfer Amount</p>
            <form action="" class="form formtransfer">
                <input type="text" name="" id="" class="forminput forminputto">
                <input type="text" name="" id="" class="forminput forminputtransferamount">
                <button class="btn transferbtn">Transfer</button>
                <label for="" class="formlabel">Transfer to</label>
                <label for="" class="formlabel">Amount</label>
            </form>
        </div>

        <!-- OPERATION: LOAN -->
        <div class="operation operationloan">
            <p class="operationlabel">Loan Request</p>
            <form action="" class="form formloan">
                <input type="text" name="" id="" class="forminput forminputloanamout">
              
                <button class="btn requestbtn">Request</button><br>
                <label for="" class="formlabel formlabelloan">Amount</label>
            </form>

        </div>
        <!-- OPERATION : CLOSE -->
        <div class="operation operationclose">
            <p class="operationlabel">Close Account</p>
            <form action="" class="form formclose">
                <input type="text" name="" id="" class="forminput forminputcloseruserid">
                <input type="password" name="" id="" class="forminput forminputcloseruserpin" maxlength="4">
                <button class="btn okbtn" >Ok</button>
                <label for="" class="formlabel">Confirm User</label>
                <label for="" class="formlabel">PIN</label>

            </form>

        </div>
    </main>
    
</body>
</html>
<script src="bankist.js"></script>
