<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bankist - Vivek Project</title>

  <link rel="stylesheet" href="styles1.css">
  <link rel="icon" type="image/x-icon" href="logo.png">
</head>

<body>

<div class="page-bg"></div>

<div class="app-container">

  <!-- NAVBAR -->

  <nav>

    <h5 class="welcomemsg">
      Login to get started
    </h5>

    <img
      src="logo.png"
      alt="Bankist Logo"
      class="logo"
    >

    <form autocomplete="off">

      <input type="text" placeholder="USER" class="userinput userlogin" maxlength="6" >

      <input type="password" placeholder="PIN" class="userinput userpin" maxlength="4" >

      <button class="loginbtn">
        Login
      </button>

    </form>

  </nav>

  <!-- DASHBOARD -->

  <main class="dashboard">

    <!-- BALANCE -->

    <div class="balance">

      <div>

        <p class="balancelabel">
          Current Balance
        </p>

        <p class="asof">
          As of :
          <span class="date">05/05/2024</span>
        </p>

      </div>

      <div class="totalbalance">
        ₹0
      </div>

    </div>

    <!-- MOVEMENTS -->

    <div class="movements">

      <!-- JS will generate movements here -->

    </div>

    <!-- TRANSFER -->

    <div class="operation operationtransfer">

      <p class="operationlabel">
        Transfer Money
      </p>

      <form class="form formtransfer">

        <input  type="text" placeholder="Transfer To" class="forminput forminputto" >

        <input type="number" placeholder="Amount" class="forminput forminputtransferamount" >

        <button class="btn transferbtn">
          Transfer
        </button>

        <label class="formlabel">
          Transfer To
        </label>

        <label class="formlabel">
          Amount
        </label>

      </form>

    </div>

    <!-- LOAN -->

    <div class="operation operationloan">

      <p class="operationlabel">
        Request Loan
      </p>

      <form class="form formloan">

        <input type="number" placeholder="Loan Amount" class="forminput forminputloanamout"  >

        <button class="btn requestbtn">
          Request
        </button>

        <label class="formlabel formlabelloan">
          Amount
        </label>

      </form>

    </div>

    <!-- CLOSE ACCOUNT -->

    <div class="operation operationclose">

      <p class="operationlabel">
        Close Account
      </p>

      <form class="form formclose">

        <input type="text" placeholder="Username" class="forminput forminputcloseruserid" >

        <input type="password" placeholder="PIN" maxlength="4" class="forminput forminputcloseruserpin" >

        <button class="btn okbtn">
          Close
        </button>

        <label class="formlabel">
          Username
        </label>

        <label class="formlabel">
          PIN
        </label>

      </form>

    </div>

    <!-- SUMMARY -->

    <div class="summary-block">

      <div class="summary">

        <p class="summarylabel">
          In
        </p>

        <p class="summaryvalue summaryvaluein">
          ₹0
        </p>

        <p class="summarylabel">
          Out
        </p>

        <p class="summaryvalue summaryvalueout">
          ₹0
        </p>

        <p class="summarylabel">
          Interest
        </p>

        <p class="summaryvalue summaryinterest">
          ₹0
        </p>

        <button class="btnsort">
          Sort
        </button>

      </div>

      <div class="logouttime">

        You will be logged out in

        <span class="timer">
          05:00
        </span>

      </div>

    </div>

  </main>

</div>

<script src="bankist.js"></script>

</body>
</html>
