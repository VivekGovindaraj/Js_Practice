<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Reader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
   
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url(./bg.jpg) no-repeat;
            background-size: cover;
        }
        .card{
            width:200px;
            background-color: #ffff;
        }
        .thought-img1 {
            background: url(./bg-2.webp) no-repeat;
            background-size: cover;
            width:100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="container-fluid mx-0 px-0 bg-white">

        <div class="row shadow justify-content-between align-items-center mx-0 text-center">
             <div class="col-4 thought-img1 m-0 p-0"></div>
             <div class="col-auto "><h3 class="fw-bold">Mind Reader.....</h3></div>
            
            <div class="col-4 thought-img1 m-0 p-0"></div>
        </div>
        
    </div>

    <div class="container text-center my-5 shadow displayBoard   rounded-3 bg-white p-3">
        
                  <h3 class="mx-5 p-2">
                     Reading your thoughts...Through connecting your brain...
                  </h3>
         
      
    </div>

    <div class="container">
       
            <form class="" id="taskform">
                <div class="row justify-content-center row-gap-2 mx-5 my-5 p-5 rounded-3 shadow bg-white">
                    <div class="col-xxl-8 col-xl-8 col-lg-8 col-md-8 col-sm-12 mx-0 ">
                        <div class="form-floating mb-2 ">
                              <input type="text" name="" id="userInput" class="form-control">
                             <label for="userInput" class="form-label">Type what's on your mind?</label>
                        </div>
                       
                    </div>
                    <div class="col-auto mx-0 mt-2">
                        <input type="button" value="Predict Mood" id="predict-btn" class="btn btn-primary ">
                    </div>
                </div>
               
            </form>

            <div class="row row-gap-2 mt-5 justify-content-center text-center pb-3">
                <div class="col-auto">
                    <div class="card shadow">
                        <div class="card-body">
                            <h4 class="fw-bold">Happy</h4>
                            <span class="fs-4 happyCount">0</span>
                        </div>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="card shadow">
                        <div class="card-body">
                            <h4 class="fw-bold">Sad</h4>
                            <span class="fs-4 sadCount">0</span>
                        </div>
                    </div>
                </div>
                <div class="col-auto">
                    <div class="card shadow">
                        <div class="card-body">
                            <h4 class="fw-bold">Motivated</h4>
                            <span class="fs-4 motivatedCount">0</span>
                        </div>
                    </div>
                </div>
            </div>
        
    </div>
    <script src="./common.js"></script>
</body>
</html>
