<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Verse</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
       <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
              <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
        <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container-fluid p-0 m-0 bg-white">
        <div class="d-flex justify-content-center text-center p-3 shadow mx-0 bg-white">
            <h2 class="fw-bold mx-0" >Memory Verse </h2>
        </div>  
    </div>
    <div class="container-fluid two m-0 p-0">
         <div class="shadow container text-center mt-5  rounded-3 pb-4 bg-container">
            <h3 class="pt-4 fw-bold">Daily Motivation</h3>
            <p class="p-2 fs-5 mt-2 motivation-container">Yeah Buddy, Light weight Baby..</p>
            <div class="pb-3 author-container text-center">--- Arnold</div>
            <div class="button-container row justify-content-center g-2 mt-3">
                <div class="col-auto">
                    <button type="button" class="btn btn-primary rounded-5"  id="likeBtn"><i class="fa fa-heart"></i> Like</button>
                </div>
                <div class="col-auto"> 
                    <button type="button" class="btn btn-primary rounded-5" id="newQuote"><i class="bi bi-arrow-clockwise"></i> New Quote</button>
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-primary rounded-5" id="skipBtn"><i class="bi bi-skip-end-fill"></i> Skip</button>
                </div>
                <div class="col-auto">
                <button type="button" class="btn btn-primary rounded-5" id="statsBtn"><i class="bi bi-bar-chart-fill"></i> Stats</button>
               </div>

                
               

            </div>
            <div class="stats-container mt-4">
                <span>📚 Quotes in library : <span class="quoteCount">21</span></span>
                <span>⏭️ Skipped : <span class="skipCount">10</span></span>
                <span>❤️ Likes : <span class="likeCount">32</span></span>
            </div>

    </div>

   <div class="shadow container mt-5 text-center rounded-3 bg-container">

    <h5 class="pt-4 fw-bold">Add your own quote</h5>

    <div class="row pb-4 mt-4 justify-content-center g-2">

        <div class="col-12 col-md-5">
            <div class="form-floating mb-2">
                <input type="text" class="form-control" id="addYourQuote">
                <label for="addYourQuote">Add your Quote</label>
            </div>
        </div>

        <div class="col-12 col-md-5">
            <div class="form-floating mb-2">
                <input type="text" class="form-control" id="addAuthor">
                <label for="addAuthor">Add author</label>
            </div>
        </div>

        <div class="col-12 col-md-auto text-center">
            <button type="button" class="btn btn-primary rounded-5 mt-2" id="addQuote">
                <i class="bi bi-file-plus-fill"></i> Add
            </button>
        </div>

    </div>

</div>

    </div>

   <script src="common.js"></script>
</body>
</html>
